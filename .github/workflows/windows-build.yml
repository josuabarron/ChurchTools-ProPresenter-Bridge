name: Build Windows bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      # Auf einen Commit festgelegt: ein bewegliches Tag (v4) könnte jederzeit
      # auf anderen Code zeigen.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tool
        run: python -m pip install -r windows/requirements-build.txt
      - name: Tests including Windows native APIs
        working-directory: windows
        run: python -m unittest discover -s tests -v
      # Über die .spec bauen: nur dort sind assets/ (Symbole zur Laufzeit) und
      # das EXE-Symbol eingetragen. Mit --onefile allein entstünde eine EXE
      # ohne Symbole.
      - name: Icons erzeugen
        working-directory: windows
        run: python make-icons.py
      - name: Build executable
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean ChurchToolsBridge.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ChurchToolsBridge-Windows-x64
          path: windows/dist/ChurchToolsBridge.exe