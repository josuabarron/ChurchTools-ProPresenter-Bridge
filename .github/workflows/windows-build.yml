name: Build Windows bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tool
        run: python -m pip install -r windows/requirements-build.txt
      - name: Tests including Windows native APIs
        working-directory: windows
        run: python -m unittest discover -s tests -v
      - name: Build executable
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ChurchToolsBridge --add-data "help.html:." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChurchToolsBridge-Windows-x64
          path: windows/dist/ChurchToolsBridge.exe
