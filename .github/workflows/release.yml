# Baut bei einem Versions-Tag beide Fassungen und legt das Release an.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Danach entsteht das Release mit den Anhängen von selbst. Ein Hochladen von
# Hand ist nicht nötig, und es werden keine eigenen Zugangsdaten gebraucht:
# GitHub stellt dem Workflow sein eigenes Token (GITHUB_TOKEN).
#
# Die Versionsnummer steht in VERSION im Repo-Wurzelverzeichnis und wird beim
# Bauen in beide Erzeugnisse geschrieben (Info.plist der Mac-App, AppVersion
# des Installers). Sie ist NICHT aus dem Tag abgeleitet, damit ein Testbau mit
# einem abweichenden Tag keine falsche Nummer erzeugt.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Erlaubt einen Probelauf ohne Tag: baut, legt aber nur Artefakte ab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (EXE + Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Tests
        working-directory: windows
        run: |
          python -m pip install -r requirements-build.txt
          python -m unittest discover -s tests -v

      - name: Icons erzeugen
        working-directory: windows
        run: python make-icons.py

      # Über die .spec: nur dort sind assets/ (Symbole zur Laufzeit) und das
      # EXE-Symbol eingetragen.
      - name: Bridge-EXE bauen
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean ChurchToolsBridge.spec

      - name: Inno Setup bereitstellen
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*' -Filter ISCC.exe -Recurse |
                  Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe nicht gefunden' }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Installer bauen
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "$env:ISCC" 'windows\installer\ChurchToolsBridge.iss' `
              "/DBridgeExe=$PWD\windows\dist\ChurchToolsBridge.exe" `
              "/DOutDir=$PWD\windows\installer\output" `
              "/DMyAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw 'Installer-Build fehlgeschlagen.' }

      - name: Version prüfen
        shell: pwsh
        run: |
          $erwartet = (Get-Content VERSION -Raw).Trim()
          $gefunden = (Get-Item 'windows\installer\output\ChurchToolsBridge-Setup.exe').VersionInfo.ProductVersion
          Write-Output "VERSION=$erwartet  Installer=$gefunden"
          if ($gefunden -ne $erwartet) { throw "Version im Installer ist $gefunden, erwartet $erwartet" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-installer
          path: windows/installer/output/ChurchToolsBridge-Setup.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-exe
          path: windows/dist/ChurchToolsBridge.exe

  macos:
    name: macOS (App)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Version prüfen
        run: |
          cat VERSION
          test -s VERSION || { echo 'VERSION ist leer'; exit 1; }

      - name: Bauen
        working-directory: mac
        run: sh scripts/build-app.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: macos-app
          path: mac/.build/dist/ChurchTools Bridge.zip

  release:
    name: Release anlegen
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artefacts

      - name: Version aus dem Tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Release anlegen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: ChurchTools Bridge ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            Enthält beide Fassungen:

            - **Setup für Windows** (`ChurchToolsBridge-Setup.exe`) – installiert die
              Bridge, den MIDI-Port und den Autostart in einem Zug.
            - **macOS-App** (`ChurchTools Bridge.zip`) – entpacken und nach
              „Programme" ziehen.

            Die Mac-App ist ad-hoc signiert. macOS zeigt daher möglicherweise eine
            Gatekeeper-Rückfrage, weil die App nicht notarisiert ist.

            Hinweis zur Windows-Fassung: der Installer holt loopMIDI bei Bedarf vom
            Hersteller (nicht mitgeliefert, Weitergabe nicht gestattet).
          files: |
            artefacts/windows-installer/ChurchToolsBridge-Setup.exe
            artefacts/macos-app/ChurchTools Bridge.zip